<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comissões 2026 – Victor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #060912;
    --bg-2: #0a0f1e;
    --surface: #0f1424;
    --surface2: #151b2f;
    --border: rgba(99,140,235,0.15);
    --border-strong: rgba(99,140,235,0.3);
    --text: #f0f6ff;
    --text-muted: #8aa1c9;
    --accent: #4f9eff;
    --accent2: #2563eb;
    --cyan: #22d3ee;
    --green: #10d977;
    --green-2: #14e88a;
    --yellow: #fbbf24;
    --orange: #f97316;
    --red: #ef4444;
    --purple: #c084fc;
    --magenta: #ec4899;
    --shadow: 0 2px 8px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.4), 0 4px 12px rgba(37,99,235,0.15);
    --shadow-glow: 0 0 40px rgba(79,158,255,0.15);
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(ellipse 1000px 500px at 50% -300px, rgba(79,158,255,0.08), transparent),
      radial-gradient(ellipse 600px 300px at 90% 20%, rgba(34,211,238,0.03), transparent),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
  }
  .header {
    background: rgba(10,15,30,0.85);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 20px 40px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 50;
  }
  .header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .header h1 span { background: linear-gradient(135deg, var(--accent), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 900; }
  .month-nav { display: flex; align-items: center; gap: 8px; }
  .month-btn { background: rgba(24,42,94,0.5); border: 1px solid var(--border); color: var(--text-muted); padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; transition: all 0.15s; letter-spacing: 0.04em; }
  .month-btn:hover { background: var(--surface2); border-color: var(--accent); color: var(--text); }
  .month-btn.active { background: linear-gradient(135deg, var(--accent2), var(--accent), var(--cyan)); border-color: var(--cyan); color: #fff; box-shadow: 0 2px 12px rgba(79,158,255,0.4); text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
  .nav-arrow { background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .nav-arrow:hover:not(:disabled) { background: var(--accent2); border-color: var(--accent); }
  .nav-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
  .main { max-width: 1500px; margin: 0 auto; padding: 32px 40px; }
  @media (min-width: 1900px) { .main { max-width: 1700px; } }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 36px; }
  .card {
    background: linear-gradient(180deg, var(--surface), rgba(15,20,36,0.6));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 26px;
    box-shadow: var(--shadow);
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(79,158,255,0.3), transparent);
  }
  .card:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow-lg); }

  /* Total Geral — destaque verde/cyan vibrante (estilo Receita Operacional) */
  .card-total {
    background: linear-gradient(135deg, #0d3b3a 0%, #0e4f6e 50%, #1a3b8a 100%);
    border-color: rgba(34,211,238,0.35);
  }
  .card-total::after {
    content: ''; position: absolute; top: -30%; right: -20%;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(16,217,119,0.25), transparent 60%);
    pointer-events: none;
  }
  .card-total .card-value { background: linear-gradient(135deg, var(--green-2), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card-total .card-label { color: #b9e8e2; }
  .card-total .card-sub { color: rgba(255,255,255,0.55); }
  .card-total:hover { border-color: rgba(34,211,238,0.55); box-shadow: var(--shadow-lg), 0 0 60px rgba(34,211,238,0.15); }

  /* Cards coloridos por contexto */
  .card-receitas {
    background: linear-gradient(135deg, #4a1455 0%, #7e2069 50%, #4a1455 100%);
    border-color: rgba(236,72,153,0.35);
  }
  .card-receitas::after { content: ''; position: absolute; top: -30%; right: -20%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(236,72,153,0.25), transparent 60%); pointer-events: none; }
  .card-receitas .card-value { color: #f0abfc; }
  .card-receitas .card-label { color: #f0abfc; }

  .card-pausados {
    background: linear-gradient(135deg, #4a2a08 0%, #6b4115 50%, #3d2107 100%);
    border-color: rgba(251,191,36,0.3);
  }
  .card-pausados::after { content: ''; position: absolute; top: -30%; right: -20%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(251,191,36,0.2), transparent 60%); pointer-events: none; }
  .card-pausados .card-value { color: var(--yellow); }
  .card-pausados .card-label { color: #fde68a; }

  .card-cancelando {
    background: linear-gradient(135deg, #4a1f05 0%, #7e3406 50%, #4a1f05 100%);
    border-color: rgba(249,115,22,0.35);
  }
  .card-cancelando::after { content: ''; position: absolute; top: -30%; right: -20%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(249,115,22,0.25), transparent 60%); pointer-events: none; }
  .card-cancelando .card-value { color: var(--orange); }
  .card-cancelando .card-label { color: #fed7aa; }
  .card-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; font-weight: 700; }
  .card-value { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .card-value.green { color: var(--green); }
  .card-value.yellow { color: var(--yellow); }
  .card-sub { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .section-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
  .section-title::before { content: ''; width: 3px; height: 14px; background: linear-gradient(180deg, var(--accent), var(--accent2)); border-radius: 2px; }
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 28px; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; }
  th { background: rgba(30,38,56,0.6); color: var(--text-muted); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; padding: 14px 22px; text-align: left; border-bottom: 1px solid var(--border); }
  th.right, td.right { text-align: right; }
  td { padding: 14px 22px; font-size: 14px; border-bottom: 1px solid rgba(51,65,85,0.35); }
  tbody tr { transition: background 0.12s; }
  tbody tr:hover { background: rgba(129,140,248,0.04); }
  tr:last-child td { border-bottom: none; }
  tr.pausado td { background: rgba(251,191,36,0.08); }
  tr.pausado td.name-cell { color: var(--yellow); }
  tr.pausado { border-left: 3px solid var(--yellow); }
  tr.cancelando td { background: rgba(249,115,22,0.08); }
  tr.cancelando td.name-cell { color: var(--orange); }
  tr.cancelando { border-left: 3px solid var(--orange); }
  tr.novo td { background: rgba(129,140,248,0.07); }
  tr.novo { border-left: 3px solid var(--accent); }
  .badge-novo { display: inline-block; font-size: 9px; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--accent), var(--cyan)); text-transform: uppercase; letter-spacing: 0.08em; padding: 3px 7px; border-radius: 5px; margin-left: 8px; vertical-align: middle; box-shadow: 0 2px 6px rgba(34,211,238,0.3); }
  .tier { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; letter-spacing: 0.02em; display: inline-flex; align-items: center; gap: 3px; }
  .tier-3 { background: rgba(138,161,201,0.15); color: var(--text-muted); border: 1px solid rgba(138,161,201,0.2); }
  .tier-5 { background: rgba(79,158,255,0.15); color: var(--accent); border: 1px solid rgba(79,158,255,0.3); }
  .tier-8 { background: rgba(16,217,119,0.15); color: var(--green); border: 1px solid rgba(16,217,119,0.3); }
  .tier-10 { background: linear-gradient(135deg, rgba(34,211,238,0.2), rgba(16,217,119,0.15)); color: var(--cyan); border: 1px solid rgba(34,211,238,0.4); }
  .tier-12 { background: linear-gradient(135deg, rgba(236,72,153,0.25), rgba(192,132,252,0.2)); color: var(--magenta); border: 1px solid rgba(236,72,153,0.45); box-shadow: 0 0 10px rgba(236,72,153,0.2); }
  .status-select { border: none; outline: none; cursor: pointer; font-size: 11px; font-weight: 700; font-family: inherit; appearance: none; padding: 5px 14px; border-radius: 20px; text-align: center; display: inline-block; width: auto; min-width: 95px; letter-spacing: 0.02em; transition: filter 0.15s; }
  .status-select:hover { filter: brightness(1.15); }
  .status-select.s-normal { background: linear-gradient(135deg, rgba(16,217,119,0.18), rgba(20,232,138,0.1)); color: var(--green); border: 1px solid rgba(16,217,119,0.3); }
  .status-select.s-pausado { background: linear-gradient(135deg, rgba(251,191,36,0.18), rgba(251,191,36,0.08)); color: var(--yellow); border: 1px solid rgba(251,191,36,0.3); }
  .status-select.s-cancelando { background: linear-gradient(135deg, rgba(249,115,22,0.18), rgba(239,68,68,0.08)); color: var(--orange); border: 1px solid rgba(249,115,22,0.3); }
  .status-select option { background: var(--surface); color: var(--text); font-size: 13px; }
  .diff-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; margin-bottom: 32px; }
  .diff-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); transition: border-color 0.15s; }
  .diff-card:hover { border-color: rgba(129,140,248,0.3); }
  .diff-card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid rgba(51,65,85,0.4); }
  .diff-card-title.added { color: var(--green); }
  .diff-card-title.removed { color: var(--red); }
  .diff-card-title.changed { color: var(--yellow); }
  .diff-item { font-size: 13px; color: var(--text); padding: 5px 0; border-bottom: 1px solid rgba(51,65,85,0.4); display: flex; align-items: center; justify-content: space-between; }
  .diff-item:last-child { border-bottom: none; }
  .diff-scroll { max-height: 200px; overflow-y: auto; }
  .diff-empty { font-size: 13px; color: var(--text-muted); font-style: italic; }
  .extras-list { display: flex; flex-wrap: wrap; gap: 10px; }
  .extra-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .extra-desc { color: var(--text-muted); }
  .extra-val { font-weight: 700; color: var(--purple); }
  .extra-val.unknown { color: var(--text-muted); font-style: italic; }
  .comm-zero { color: var(--text-muted); }
  .mensal-cell { cursor: pointer; transition: background 0.12s; border-radius: 4px; position: relative; }
  .mensal-cell:hover { background: rgba(129,140,248,0.1); color: var(--accent); }
  .mensal-cell::after { content: '✎'; position: absolute; right: -2px; top: 50%; transform: translateY(-50%); font-size: 10px; opacity: 0; color: var(--accent); transition: opacity 0.12s; }
  .mensal-cell:hover::after { opacity: 0.6; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px 32px; width: 420px; max-width: 95vw; }
  .modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 20px; }
  .form-row { margin-bottom: 16px; }
  .form-row label { display: block; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .form-row input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--text); font-size: 14px; font-family: inherit; outline: none; }
  .form-row input:focus { border-color: var(--accent); }
  .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
  .btn { padding: 9px 22px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; transition: all 0.15s; letter-spacing: 0.02em; }
  .btn-primary { background: linear-gradient(135deg, var(--accent2), var(--accent)); color: #fff; box-shadow: 0 2px 8px rgba(99,102,241,0.3); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,0.4); filter: brightness(1.1); }
  .btn-ghost { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent); }
  /* Tablet */
  @media (max-width: 900px) {
    .diff-grid { grid-template-columns: 1fr; }
  }

  /* Mobile */
  @media (max-width: 700px) {
    .header { flex-direction: column; gap: 12px; align-items: stretch; padding: 14px 16px; }
    .header h1 { font-size: 17px; }
    #headerSub { font-size: 11px; }
    .month-nav { width: 100%; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
    .month-nav::-webkit-scrollbar { height: 4px; }
    .month-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .month-btn { padding: 6px 10px; font-size: 12px; flex-shrink: 0; }
    .nav-arrow { width: 30px; height: 30px; flex-shrink: 0; }

    .main { padding: 16px 12px; }
    .summary { grid-template-columns: 1fr; gap: 10px; margin-bottom: 18px; }
    .card { padding: 14px 16px; }
    .card[style*="grid-column:span 2"], .card[style*="grid-column: span 2"] { grid-column: span 1 !important; }
    .card-value { font-size: 22px; }
    .card-value[style*="font-size:34px"] { font-size: 28px !important; }

    .section-title { font-size: 13px; }

    /* Accordion-style card view */
    .table-wrap table thead { display: none; }
    .table-wrap table, .table-wrap tbody, .table-wrap tr, .table-wrap td { display: block; width: 100%; }
    .table-wrap tr {
      padding: 14px 38px 14px 16px;
      border-bottom: 1px solid rgba(51,65,85,0.5);
      position: relative;
      cursor: pointer;
    }
    .table-wrap tr:last-child { border-bottom: none; }
    .table-wrap td {
      padding: 0;
      border: none;
      font-size: 13px;
      text-align: left !important;
      display: block;
      width: 100%;
    }

    /* Chevron pinned right of TR */
    .table-wrap tr::after {
      content: '▾';
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--text-muted);
      transition: transform 0.2s;
      pointer-events: none;
    }
    .table-wrap tr.expanded::after {
      transform: translateY(-50%) rotate(180deg);
    }

    /* Name row */
    .table-wrap td.name-cell {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Commission row (always visible) */
    .table-wrap td.comm-cell {
      margin-top: 6px;
      font-size: 17px;
      font-weight: 700;
      color: var(--green);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .table-wrap td.comm-cell::before {
      content: 'Comissão';
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Hide detail cells when collapsed */
    .table-wrap td[data-label="Mensalidade"],
    .table-wrap td[data-label="Maturidade"],
    .table-wrap td[data-label="% Comissão"],
    .table-wrap tr td:last-child {
      display: none;
    }

    /* Expanded state: show details */
    .table-wrap tr.expanded td[data-label="Mensalidade"],
    .table-wrap tr.expanded td[data-label="Maturidade"],
    .table-wrap tr.expanded td[data-label="% Comissão"] {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(51,65,85,0.4);
    }
    .table-wrap tr.expanded td[data-label="Maturidade"],
    .table-wrap tr.expanded td[data-label="% Comissão"] {
      border-top: none;
      padding-top: 4px;
      margin-top: 4px;
    }
    .table-wrap tr.expanded td[data-label]::before {
      content: attr(data-label);
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    /* Status cell in expanded state */
    .table-wrap tr.expanded td:last-child {
      display: block;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(51,65,85,0.4);
    }
    .table-wrap tr.expanded td:last-child::before {
      content: 'Status';
      display: block;
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      margin-bottom: 6px;
    }

    tr.pausado, tr.cancelando, tr.novo {
      border-left-width: 3px;
      border-left-style: solid;
      padding-left: 14px;
    }

    /* Hover hint on collapsed comm value */
    .table-wrap td.comm-cell::after {
      content: '';
      display: none;
    }

    .status-select { width: auto; min-width: 90px; }
    .tier { padding: 2px 6px; }

    .diff-card { padding: 12px 14px; }
    .diff-item { font-size: 12px; padding: 4px 0; }
    .extras-list { gap: 6px; }
    .extra-item { font-size: 12px; padding: 6px 10px; }

    .modal { padding: 22px 20px; width: 92vw; }
    .modal h2 { font-size: 15px; margin-bottom: 14px; }
    .form-row { margin-bottom: 12px; }
    .form-row input { font-size: 16px; } /* 16px prevents iOS zoom */

    #syncStatus { font-size: 10px; }
  }

  /* Very small screens */
  @media (max-width: 380px) {
    .header h1 { font-size: 15px; }
    .month-btn { padding: 5px 8px; font-size: 11px; }
    .card-value { font-size: 20px; }
    .card-value[style*="font-size:34px"] { font-size: 24px !important; }
  }
</style>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="header">
  <div>
    <h1>Comissões <span>2026</span> — Victor</h1>
    <div style="font-size:12px;color:var(--text-muted);margin-top:3px" id="headerSub"></div>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="month-nav" id="monthNav"></div>
    <span id="syncStatus" style="font-size:11px;color:var(--text-muted);transition:opacity 0.3s">⟳ Carregando...</span>
    <button id="heartbeatBtn" class="btn btn-ghost" style="font-size:11px;padding:4px 10px;opacity:0.6;display:flex;align-items:center;gap:5px" title="Marcar presença no banco (evita pausa por inatividade)" onclick="markHeartbeat()">💚 <span id="heartbeatLabel">Check-in</span></button>
    <button class="btn btn-ghost" style="font-size:11px;padding:4px 10px;opacity:0.5" onclick="if(confirm('Limpar TODOS os dados (Supabase + local)?')){sb.from('comissoes_state').delete().neq('id','xxxxxxx').then(function(){localStorage.removeItem('comm_overrides');localStorage.removeItem('comm_manual');localStorage.removeItem('comm_extras');localStorage.removeItem('comm_valueOverrides');location.reload();});}">↺ Reset</button>
  </div>
</div>

<div class="main" id="main"></div>

<div class="modal-overlay" id="modalExtraOverlay">
  <div class="modal">
    <h2>Adicionar Receita</h2>
    <div class="form-row"><label>Descrição</label><input type="text" id="extraDesc" placeholder="Ex: LP Fast - Cliente X" /></div>
    <div class="form-row">
      <label>Status</label>
      <div style="display:flex;gap:8px;margin-top:4px">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--green)"><input type="radio" name="extraStatus" value="pago" checked /> Pago</label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--yellow)"><input type="radio" name="extraStatus" value="pendente" /> Pendente</label>

function _persistToSupabase() {
  var manual = {}, extras = {};
  MONTHS.forEach(function(m) {

    extras[m] = DATA[m] && DATA[m].extras || [];
  });

  showSync('saving');
  Promise.all([
    sb.from('comissoes_state').upsert({id:'overrides', data:overrides, updated_at:now}),
    sb.from('comissoes_state').upsert({id:'manual', data:manual, updated_at:now}),
    sb.from('comissoes_state').upsert({id:'extras', data:extras, updated_at:now}),
    sb.from('comissoes_state').upsert({id:'valueOverrides', data:valueOverrides, updated_at:now})
  ]).then(function(results) {
    var err = results.find(function(r){return r.error;});
    if (err) {

      showSync('error');
    } else {

    }

    console.error('Erro:', e);
    showSync('error');
  });

function loadState(cb) {
  showSync('loading');
  sb.from('comissoes_state').select('id, data').then(function(res) {
    if (res.error) {
      console.error('Erro ao carregar:', res.error);
      _loadFromLocalStorage();
      showSync('offline');
      cb && cb();
      return;
    }

    var rows = res.data || [];

    // If Supabase is empty but localStorage has data, migrate up
    if (rows.length === 0 && _hasLocalStorageData()) {
      console.log('Migrando localStorage → Supabase...');
      _loadFromLocalStorage();
      _persistToSupabase();
      cb && cb();
      return;
    }

    rows.forEach(function(row) {
      if (row.id === 'overrides') overrides = row.data || {};
      if (row.id === 'valueOverrides') valueOverrides = row.data || {};
      if (row.id === 'manual') {
        var manual = row.data || {};
        MONTHS.forEach(function(m) {
          if (manual[m] && manual[m].length > 0 && DATA[m]) {
            manual[m].forEach(function(mc) {
              if (!DATA[m].clients.find(function(c){return c.name===mc.name;})) DATA[m].clients.push(mc);
            });
          }
        });
      }
      if (row.id === 'extras') {
        var ex = row.data || {};
        MONTHS.forEach(function(m) { if (ex[m] && DATA[m]) DATA[m].extras = ex[m]; });
      }
    });
    showSync('ok');
    cb && cb();
  });
}

function _hasLocalStorageData() {
  try {
    return !!(localStorage.getItem('comm_overrides')
      || localStorage.getItem('comm_manual')
      || localStorage.getItem('comm_extras'));
  } catch(e) { return false; }
}

function _loadFromLocalStorage() {
  try {
    var so = localStorage.getItem('comm_overrides');
    if (so) overrides = JSON.parse(so);
    var svo = localStorage.getItem('comm_valueOverrides');
    if (svo) valueOverrides = JSON.parse(svo);
    var sm = localStorage.getItem('comm_manual');
    if (sm) {
      var manual = JSON.parse(sm);
      MONTHS.forEach(function(m) {
        if (manual[m] && manual[m].length > 0 && DATA[m]) {

          });
        }
      });
    }
    var se = localStorage.getItem('comm_extras');

      var ex = JSON.parse(se);
      MONTHS.forEach(function(m) { if (ex[m] && DATA[m]) DATA[m].extras = ex[m]; });
    }
  } catch(e) {}
}

  el.textContent = labels[state] || '';

// Get the most recent value override for a client/field at or before monthIdx
function getValueOverride(name, field, monthIdx) {
  for (var i = monthIdx; i >= BASE_MONTH_IDX; i--) {
    var m = MONTHS[i];
    if (valueOverrides[m] && valueOverrides[m][name] && valueOverrides[m][name][field] !== undefined) {
      return valueOverrides[m][name][field];
    }
  }
  return undefined;
}

// Apply value overrides to a client at given monthIdx
function applyValueOverrides(client, monthIdx) {
  var ovMensal = getValueOverride(client.name, 'valorMensal', monthIdx);
  if (ovMensal !== undefined) client.valorMensal = ovMensal;
  var ovMat = getValueOverride(client.name, 'mesesAtivos', monthIdx);
  if (ovMat !== undefined) client.mesesAtivos = ovMat;
  var ovPct = getValueOverride(client.name, 'pctComissao', monthIdx);
  if (ovPct !== undefined) client.pctComissao = ovPct;

  // Commission auto-recalculates from (possibly overridden) mensalidade × pct
  // Explicit valorComissao override takes precedence (rare edge case)
  var ovComm = getValueOverride(client.name, 'valorComissao', monthIdx);
  if (ovComm !== undefined) {
    client.valorComissao = ovComm;
  } else {
    client.valorComissao = +(client.valorMensal * client.pctComissao).toFixed(2);
  }
  return client;
}

var TIMELINE = {};

// Compute maturity for month X based on dataInicio
// Formula: DATEDIF(start, monthRef, "m") + 1
// monthRef = first day of the target month
// For JUL 2026 reference: a client started Jun/2025 = 13 months
function computeMaturity(dataInicioStr, monthIdx) {
  if (!dataInicioStr) return 1;
  var parts = dataInicioStr.split('/');
  if (parts.length !== 3) return 1;
  var startMonth = parseInt(parts[1]); // 1-12
  var startYear = parseInt(parts[2]);

  var targetMonth = monthIdx + 1; // JAN=1...DEZ=12
  var targetYear = 2026;

  // DATEDIF(start, ref, "m") + 1
  // For Jun/2025 → Jul/2026: diff = 13, +1 = 14... but user wants 13.
  // Actually DATEDIF gives complete months: Jun/2025 → Jul/2026 = 13 complete months
  // So formula should be: full months between dates, then +1 gives wrong answer.
  // Looking at expected: Jun/2025 → Jul/2026 = 13m means counting INCLUSIVE both endpoints.
  // (2026-2025)*12 + (7-6) = 13. That IS the expected value (without +1).
  // So the spec's "+1" means count both endpoints, which already happens with this math.
  var months = (targetYear - startYear) * 12 + (targetMonth - startMonth) + 1;
  return months;
}

    var ovr = overrides[month] || {};
    var clients = d.clients.map(function(c) {
      var finalStatus = ovr[c.name] || c.status;
      return {name:c.name, valorMensal:c.valorMensal, dataInicio:c.dataInicio, mesesAtivos:c.mesesAtivos, pctComissao:c.pctComissao, valorComissao:c.valorComissao, status:finalStatus, isManual:c.isManual};
    });
    TIMELINE[month] = {clients:clients, extras:d.extras||[]};
  }

  // JUL = BASE — use spreadsheet data, BUT bump maturity by +1 (spec correction)
  // The spreadsheet has maturity 1 month behind the formula
  // Then % and commission recomputed from corrected maturity
  var julMonth = MONTHS[BASE_MONTH_IDX];
  var julD = DATA[julMonth];
  if (julD) {
    var julOvr = overrides[julMonth] || {};
    var julClients = julD.clients.map(function(c) {
      var mesesAtivos = c.isManual ? (c.mesesAtivos || 1) : ((c.mesesAtivos || 0) + 1);
      var rate = commRate(mesesAtivos);
      var valorComissao = +(c.valorMensal * rate).toFixed(2);
      var finalStatus = julOvr[c.name] || c.status;
      var client = {name:c.name, valorMensal:c.valorMensal, dataInicio:c.dataInicio, mesesAtivos:mesesAtivos, pctComissao:rate, valorComissao:valorComissao, status:finalStatus, isManual:c.isManual};
      return applyValueOverrides(client, BASE_MONTH_IDX);
    });
    TIMELINE[julMonth] = {clients:julClients, extras:julD.extras||[]};
  }

  // AGO onward: chronological propagation
  for (var i = BASE_MONTH_IDX + 1; i < MONTHS.length; i++) {
    var month = MONTHS[i];
    var prevMonth = MONTHS[i-1];
    var prev = TIMELINE[prevMonth];
    if (!prev) { TIMELINE[month] = {clients:[], extras:DATA[month]&&DATA[month].extras||[]}; continue; }
    var ovr = overrides[month] || {};

    var carried = prev.clients
      .filter(function(c) { return c.status !== 'cancelando'; })
      .map(function(c) {
        var inherited = c.status;
        var finalStatus = ovr[c.name] || inherited;

        // Maturity: increment only if inherited was ACTIVE (not paused)
        // PROTECTION: once paused, never auto-reactivate
        var mesesAtivos, rate, valorComissao;
        if (inherited === 'pausado') {
          mesesAtivos = c.mesesAtivos; // freeze
          rate = c.pctComissao;          // freeze
          valorComissao = c.valorComissao; // freeze
        } else {
          mesesAtivos = c.mesesAtivos + 1;
          rate = commRate(mesesAtivos);
          valorComissao = +(c.valorMensal * rate).toFixed(2);
        }

        var client = {name:c.name, valorMensal:c.valorMensal, dataInicio:c.dataInicio, mesesAtivos:mesesAtivos, pctComissao:rate, valorComissao:valorComissao, status:finalStatus, isManual:false};
        return applyValueOverrides(client, i);
      });

    var thisManual = (DATA[month] && DATA[month].clients || []).filter(function(c){return c.isManual;});
    thisManual.forEach(function(mc) {
      if (!carried.find(function(c){return c.name===mc.name;})) carried.push(mc);
    });

    TIMELINE[month] = {clients:carried, extras:DATA[month]&&DATA[month].extras||[]};
  }
}

function computeDiff(monthIdx) {
  // JUL is base — no diff
  if (monthIdx <= BASE_MONTH_IDX) return null;
  var prevM = MONTHS[monthIdx-1], currM = MONTHS[monthIdx];
  var prev = TIMELINE[prevM], curr = TIMELINE[currM];
  if (!prev || !curr) return null;

  var prevNames = {};
  prev.clients.forEach(function(c){prevNames[c.name]=true;});
  var currNames = {};
  curr.clients.forEach(function(c){currNames[c.name]=true;});

  var added = curr.clients.filter(function(c){return !prevNames[c.name];});
  var removed = prev.clients.filter(function(c){ return !currNames[c.name]; });

  // STATUS of month M = manual events of month M-1
  // The diff shows what changed when the user acted in M-1
  var statusChanged = [];
  var prevOvr = overrides[prevM] || {};

  Object.keys(prevOvr).forEach(function(name) {
    var inheritedInPrev;

    if (monthIdx - 1 === BASE_MONTH_IDX) {
      // Prev month is JUL (BASE). Inherited = original JUL status from spreadsheet.
      // NEVER compare with JUN — JUN is irrelevant.
      var base = (DATA[MONTHS[BASE_MONTH_IDX]] && DATA[MONTHS[BASE_MONTH_IDX]].clients || [])
        .find(function(c){return c.name===name;});
      inheritedInPrev = base ? base.status : 'normal';
    } else {
      // For AGO+, inherited = final status of M-2 (= what JUL passed to AGO before AGO events)
      var prevPrev = TIMELINE[MONTHS[monthIdx-2]];
      var pp = prevPrev ? prevPrev.clients.find(function(c){return c.name===name;}) : null;
      inheritedInPrev = pp ? pp.status : 'normal';
    }

    var eventStatus = prevOvr[name];
    if (inheritedInPrev !== eventStatus) {
      statusChanged.push({name:name, from:inheritedInPrev, to:eventStatus});
    }
  });

  return {added:added, removed:removed, statusChanged:statusChanged};
}
var STATUS_LABELS = {normal:'Ativo', pausado:'Pausado', cancelando:'Cancelando'};

function toggleExpand(tr, event) {
  // Only toggle in mobile (handled visually by CSS); harmless in desktop
  if (window.innerWidth > 700) return;
  tr.classList.toggle('expanded');
}

function startEditValue(td, clientName, field, currentValue, event) {
  if (event) event.stopPropagation();
  if (td.querySelector('input')) return;
  var prevHtml = td.innerHTML;
  td.innerHTML = '<input type="number" step="0.01" min="0" value="' + currentValue + '" '
    + 'onblur="commitEditValue(this,\'' + clientName.replace(/'/g,"\\'") + '\',\'' + field + '\')" '
    + 'onclick="event.stopPropagation()" '
    + 'onkeydown="if(event.key===\'Enter\')this.blur();if(event.key===\'Escape\'){this.dataset.cancel=1;this.blur();}" '
    + 'style="width:100%;background:var(--surface2);border:1px solid var(--accent);color:var(--text);padding:4px 8px;border-radius:6px;font-size:13px;font-weight:600;font-family:inherit;text-align:right;outline:none" />';
  var input = td.querySelector('input');
  input.dataset.prevHtml = prevHtml;
  setTimeout(function(){ input.focus(); input.select(); }, 0);
}

function commitEditValue(input, clientName, field) {
  if (input.dataset.cancel) {
    input.parentElement.innerHTML = input.dataset.prevHtml;
    return;
  }
  var newVal = parseFloat(input.value);
  if (isNaN(newVal) || newVal < 0) {
    input.parentElement.innerHTML = input.dataset.prevHtml;
    return;
  }
  changeValue(clientName, field, +newVal.toFixed(2));
}

function changeValue(clientName, field, newValue) {
  var month = MONTHS[currentIdx];
  if (!valueOverrides[month]) valueOverrides[month] = {};
  if (!valueOverrides[month][clientName]) valueOverrides[month][clientName] = {};
  valueOverrides[month][clientName][field] = newValue;

  // Clear stale future overrides for same client+field
  for (var i = currentIdx + 1; i < MONTHS.length; i++) {
    var m = MONTHS[i];
    if (valueOverrides[m] && valueOverrides[m][clientName] && valueOverrides[m][clientName][field] !== undefined) {
      delete valueOverrides[m][clientName][field];
      if (Object.keys(valueOverrides[m][clientName]).length === 0) delete valueOverrides[m][clientName];
      if (Object.keys(valueOverrides[m]).length === 0) delete valueOverrides[m];
    }
  }
  saveState();
  render();
}

function changeStatus(clientName, newStatus, selectEl) {
  var month = MONTHS[currentIdx];
  if (!overrides[month]) overrides[month] = {};
  overrides[month][clientName] = newStatus;

  // CRITICAL: Clear "stale" overrides in future months for this client.
  // Rationale: the most recent action by the user must always win.
  // If user later wants a different status in a future month, they will set it again.
  for (var i = currentIdx + 1; i < MONTHS.length; i++) {
    var m = MONTHS[i];
    if (overrides[m] && overrides[m][clientName] !== undefined) {
      delete overrides[m][clientName];
      if (Object.keys(overrides[m]).length === 0) delete overrides[m];
    }
  }

  saveState();
  render();
}

function openExtraModal() {
  document.getElementById('extraDesc').value='';
  document.getElementById('extraValor').value='';
  document.querySelector('input[name="extraStatus"][value="pago"]').checked = true;
  document.getElementById('extraValorRow').style.display = '';
  document.getElementById('modalExtraOverlay').classList.add('open');
  setTimeout(function(){document.getElementById('extraDesc').focus();},50);
  document.querySelectorAll('input[name="extraStatus"]').forEach(function(r) {
    r.onchange = function() { document.getElementById('extraValorRow').style.display = r.value === 'pendente' ? 'none' : ''; };
  });
}
function closeExtraModal() { document.getElementById('modalExtraOverlay').classList.remove('open'); }
function addExtra() {
  var desc = document.getElementById('extraDesc').value.trim();
  var statusRadio = document.querySelector('input[name="extraStatus"]:checked').value;
  var valor;
  if (statusRadio === 'pendente') {
    valor = '?';
    if (!desc) { alert('Preencha a descrição.'); return; }
  } else {
    valor = parseFloat(document.getElementById('extraValor').value) || 0;
    if (!desc || valor <= 0) { alert('Preencha descrição e valor.'); return; }
  }
  var month = MONTHS[currentIdx];
  if (!DATA[month].extras) DATA[month].extras = [];
  DATA[month].extras.push({descricao:desc, valor:valor, isManual:true});
  saveState(); closeExtraModal(); render();
}
function removeExtra(idx) {
  DATA[MONTHS[currentIdx]].extras.splice(idx, 1);
  saveState(); render();
}

function openModal() {
  document.getElementById('newName').value='';
  document.getElementById('newValor').value='';
  document.getElementById('newClientPreview').textContent='';
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(function(){document.getElementById('newName').focus();},50);
  document.getElementById('newName').oninput = updatePreview;
  document.getElementById('newValor').oninput = updatePreview;
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function updatePreview() {
  var valor = parseFloat(document.getElementById('newValor').value) || 0;
  var prev = document.getElementById('newClientPreview');
  if (valor > 0) { prev.textContent = 'Mês 1 → 3% → comissão de ' + fmt(+(valor*0.03).toFixed(2)); prev.style.color='var(--green)'; }
  else prev.textContent = '';
}
function removeClient(name) {
  if (!confirm('Apagar o cliente "' + name + '" deste mês em diante?')) return;
  var startIdx = currentIdx;
  // Remove from current month and all future months in DATA
  for (var i = startIdx; i < MONTHS.length; i++) {
    var m = MONTHS[i];
    if (DATA[m] && DATA[m].clients) {
      DATA[m].clients = DATA[m].clients.filter(function(c){return c.name !== name;});
    }
    // Also drop any override for this client in future months
    if (overrides[m] && overrides[m][name] !== undefined) {
      delete overrides[m][name];
      if (Object.keys(overrides[m]).length === 0) delete overrides[m];
    }
  }
  saveState();
  render();
}

function addClient() {
  var name = document.getElementById('newName').value.trim();
  var valor = parseFloat(document.getElementById('newValor').value) || 0;
  if (!name || valor <= 0) { alert('Preencha nome e mensalidade.'); return; }
  var month = MONTHS[currentIdx];
  DATA[month].clients.push({name:name, valorMensal:valor, dataInicio:'', mesesAtivos:1, pctComissao:0.03, valorComissao:+(valor*0.03).toFixed(2), status:'normal', isManual:true});
  saveState(); closeModal(); render();
}

function renderHeaderSub() {
  var month = MONTHS[currentIdx], next = MONTHS[currentIdx+1];
  var el = document.getElementById('headerSub');
  if (el) el.textContent = next
    ? 'Competência: ' + MONTH_LABELS[month] + ' · Recebimento: ' + MONTH_LABELS[next] + ' 2026'
    : 'Competência: ' + MONTH_LABELS[month] + ' 2026';
}

function renderNav() {
  var nav = document.getElementById('monthNav');
  var html = '<button class="nav-arrow" id="prevBtn" onclick="navigate(-1)">&#8592;</button>';
  MONTHS.forEach(function(m, i) {
    html += '<button class="month-btn' + (i===currentIdx?' active':'') + '" onclick="setMonth('+i+')">'+m+'</button>';
  });
  html += '<button class="nav-arrow" id="nextBtn" onclick="navigate(1)">&#8594;</button>';
  nav.innerHTML = html;
  document.getElementById('prevBtn').disabled = currentIdx === 0;
  document.getElementById('nextBtn').disabled = currentIdx === MONTHS.length - 1;

  // Auto-scroll to active month (especially useful on mobile horizontal scroll)
  setTimeout(function() {
    var activeBtn = nav.querySelector('.month-btn.active');
    if (activeBtn && nav.scrollWidth > nav.clientWidth) {
      var btnLeft = activeBtn.offsetLeft;
      var btnWidth = activeBtn.offsetWidth;
      var navWidth = nav.clientWidth;
      nav.scrollLeft = btnLeft - (navWidth / 2) + (btnWidth / 2);
    }
  }, 0);
}

function navigate(dir) {
  var next = currentIdx + dir;
  if (next >= 0 && next < MONTHS.length) { currentIdx = next; render(); }
}
function setMonth(i) { currentIdx = i; render(); }

function statusSelectHtml(clientName, status) {
  var safe = clientName.replace(/'/g, "\\'");
  return '<select class="status-select s-' + status + '" onchange="changeStatus(\'' + safe + '\', this.value, this)">'
    + '<option value="normal"' + (status==='normal'?' selected':'') + '>Ativo</option>'
    + '<option value="pausado"' + (status==='pausado'?' selected':'') + '>Pausado</option>'
    + '<option value="cancelando"' + (status==='cancelando'?' selected':'') + '>Cancelando</option>'
    + '</select>';
}

function render() {
  buildTimeline();
  renderNav();
  renderHeaderSub();
  var month = MONTHS[currentIdx];
  var t = TIMELINE[month];
  if (!t) return;

  var activeClients = t.clients.filter(function(c){return c.status==='normal';});
  var pausedClients = t.clients.filter(function(c){return c.status==='pausado';});
  var cancellingClients = t.clients.filter(function(c){return c.status==='cancelando';});

  // Total = ativos + cancelando (cancelando ainda paga no mês atual, só sai no próximo)
  var payingClients = t.clients.filter(function(c){return c.status==='normal' || c.status==='cancelando';});
  var totalComissao = payingClients.reduce(function(s,c){return s+c.valorComissao;}, 0);
  var extrasTotal = (t.extras||[]).reduce(function(s,e){return s+(typeof e.valor==='number'?e.valor:0);}, 0);
  var totalGeral = totalComissao + extrasTotal;

  var nextLabel = MONTH_LABELS[MONTHS[currentIdx+1]] || 'Janeiro 2027';

  // Diff
  var diff = computeDiff(currentIdx);
  var diffHtml = '';
  if (diff) {
    diffHtml = '<div class="section-title">Mudanças de ' + MONTH_LABELS[MONTHS[currentIdx-1]] + ' para ' + MONTH_LABELS[month] + '</div>'
      + '<div class="diff-grid">'
      + '<div class="diff-card"><div class="diff-card-title added">&#43; Entradas (' + diff.added.length + ')</div>';
    if (diff.added.length === 0) diffHtml += '<div class="diff-empty">Nenhum cliente novo</div>';
    else diff.added.forEach(function(c) { diffHtml += '<div class="diff-item"><span>'+c.name+'</span></div>'; });
    diffHtml += '</div><div class="diff-card"><div class="diff-card-title removed">&#8722; Saídas (' + diff.removed.length + ')</div>';
    if (diff.removed.length === 0) diffHtml += '<div class="diff-empty">Nenhuma saída</div>';
    else diff.removed.forEach(function(c) { diffHtml += '<div class="diff-item"><span>'+c.name+'</span></div>'; });
    diffHtml += '</div><div class="diff-card"><div class="diff-card-title changed">&#8635; Status (' + diff.statusChanged.length + ')</div>';
    if (diff.statusChanged.length === 0) diffHtml += '<div class="diff-empty">Nenhuma alteração</div>';
    else {
      diffHtml += '<div class="diff-scroll">';
      diff.statusChanged.forEach(function(c) { diffHtml += '<div class="diff-item"><span>'+c.name+'</span><span style="font-size:11px;color:var(--text-muted)">'+(STATUS_LABELS[c.from]||c.from)+' &#8594; '+(STATUS_LABELS[c.to]||c.to)+'</span></div>'; });
      diffHtml += '</div>';
    }
    diffHtml += '</div></div>';
  }

  // Extras
  var pendingExtras = (t.extras||[]).filter(function(e){return e.valor==='?'||e.valor===null;});
  var hasExtras = t.extras && t.extras.length > 0;
  var extrasHtml = '<div class="section-title" style="display:flex;align-items:center;justify-content:space-between"><span>Receitas Adicionais do Mês</span>'
    + '<div style="display:flex;align-items:center;gap:12px">';
  if (extrasTotal > 0) extrasHtml += '<span style="font-size:13px;color:var(--purple);font-weight:600">+' + fmt(extrasTotal) + (pendingExtras.length > 0 ? ' · ' + pendingExtras.length + ' pendente(s)' : '') + '</span>';
  extrasHtml += '<button class="btn btn-primary" style="font-size:12px;padding:4px 12px" onclick="openExtraModal()">+ Receita</button></div></div>';
  extrasHtml += '<div class="table-wrap" style="margin-bottom:24px"><div style="padding:16px 18px">';
  if (hasExtras) {
    extrasHtml += '<div class="extras-list">';
    t.extras.forEach(function(e, ei) {
      extrasHtml += '<div class="extra-item"><span class="extra-desc">' + e.descricao + '</span>';
      if (e.isManual) extrasHtml += '<button onclick="removeExtra('+ei+')" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:13px;margin-right:4px">✕</button>';
      var valClass = (e.valor === '?' || e.valor === null) ? ' unknown' : '';
      var valText = e.valor === '?' ? 'Pendente' : (e.valor === null ? '—' : fmt(e.valor));
      extrasHtml += '<span class="extra-val' + valClass + '">' + valText + '</span></div>';
    });
    extrasHtml += '</div>';
  } else {
    extrasHtml += '<span style="color:var(--text-muted);font-size:13px;font-style:italic">Nenhuma receita adicional neste mês.</span>';
  }
  extrasHtml += '</div></div>';

  // Table rows (alphabetical)
  var allClients = t.clients.slice().sort(function(a,b){return a.name.localeCompare(b.name,'pt-BR');});
  var tableRows = '';
  allClients.forEach(function(c) {
    var rowClass = c.status + (c.isManual ? ' novo' : '');
    var nameSafe = c.name.replace(/'/g, "\\'");
    var deleteBtn = c.isManual ? '<button onclick="removeClient(\'' + nameSafe + '\')" title="Apagar cliente" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:13px;margin-left:8px;opacity:0.5" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.5">✕</button>' : '';
    var novoBadge = c.isManual ? '<span class="badge-novo">novo</span>' : '';
    tableRows += '<tr class="' + rowClass + '" onclick="toggleExpand(this,event)">'
      + '<td class="name-cell">' + c.name + novoBadge + deleteBtn + '</td>'
      + '<td class="right mensal-cell" data-label="Mensalidade" onclick="startEditValue(this,\'' + nameSafe + '\',\'valorMensal\',' + c.valorMensal + ',event)" title="Clique para editar">' + fmt(c.valorMensal) + '</td>'
      + '<td class="right" data-label="Maturidade"><span class="tier ' + tierClass(c.mesesAtivos) + '">' + c.mesesAtivos + 'm' + (c.mesesAtivos >= 12 ? ' ⭐' : '') + '</span></td>'
      + '<td class="right" data-label="% Comissão">' + pct(c.pctComissao) + '</td>'
      + '<td class="right comm-cell' + (c.valorComissao===0?' comm-zero':'') + '" data-label="Comissão">' + (c.valorComissao===0?'—':fmt(c.valorComissao)) + '</td>'
      + '<td onclick="event.stopPropagation()">' + statusSelectHtml(c.name, c.status) + '</td>'
      + '</tr>';
  });

  // Assemble
  var html = '<div class="summary">'
    + '<div class="card card-total" style="grid-column:span 2">'
    + '<div class="card-label">Total geral · a receber em ' + nextLabel + '</div>'
    + '<div class="card-value" style="font-size:48px;font-weight:800" id="summary-total">' + fmt(totalGeral) + '</div>'
    + '<div class="card-sub" id="summary-sub">' + (extrasTotal > 0 ? 'inclui ' + fmt(extrasTotal) + ' em receitas adicionais' : 'comissão recorrente do mês') + '</div>'
    + '</div>';
  if (extrasTotal > 0) {
    html += '<div class="card card-receitas"><div class="card-label">Receitas adicionais</div><div class="card-value">' + fmt(extrasTotal) + '</div><div class="card-sub">vendas & indicações do mês</div></div>';
  }
  html += '<div class="card card-pausados"><div class="card-label">Pausados</div><div class="card-value" id="summary-paused">' + pausedClients.length + '</div>'
    + '<div class="card-sub" style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(251,191,36,0.2)" id="summary-active">' + activeClients.length + ' clientes ativos</div></div>';
  if (cancellingClients.length > 0) {
    html += '<div class="card card-cancelando"><div class="card-label">Cancelando</div><div class="card-value">' + cancellingClients.length + '</div><div class="card-sub">saem no próximo mês</div></div>';
  }
  html += '</div>';
  html += diffHtml;
  html += '<div class="section-title" style="display:flex;align-items:center;justify-content:space-between"><span>Clientes — ' + MONTH_LABELS[month] + '</span>'
    + '<button class="btn btn-primary" style="font-size:13px;padding:5px 14px" onclick="openModal()">+ Novo cliente</button></div>';
  html += '<div class="table-wrap"><table><thead><tr><th>Cliente</th><th class="right">Mensalidade</th><th class="right">Maturidade</th><th class="right">% Comissão</th><th class="right">Comissão</th><th>Status</th></tr></thead><tbody>' + tableRows + '</tbody></table></div>';
  html += extrasHtml;
  document.getElementById('main').innerHTML = html;
}

loadState(function() { render(); });
</script>
</body>
</html>
