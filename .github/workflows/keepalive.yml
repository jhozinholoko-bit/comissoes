name: Manter Supabase ativo

# O projeto Supabase no plano free pausa apos ~7 dias sem atividade.
# Este job escreve e le de volta uma linha de heartbeat para gerar atividade
# real, sem depender de alguem abrir o app e clicar no botao de check-in.
#
# As credenciais sao lidas do proprio index.html. Nao ha segredo a proteger:
# a chave e "publishable" e ja e servida publicamente no site, entao um secret
# daria falsa sensacao de sigilo e mais uma coisa para desalinhar.
on:
  schedule:
    # A cada 3 dias, 09:00 UTC (06:00 em Brasilia). Margem folgada ante o limite.
    - cron: '0 9 */3 * *'
  workflow_dispatch:        # permite rodar na mao pelo botao "Run workflow"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gravar e confirmar heartbeat
        run: |
          set -euo pipefail

          # Le URL e chave do index.html (fonte unica: se mudarem la, o job segue).
          # sed em vez de grep -P: -P nao existe no BSD grep nem em locale nao-UTF8.
          SUPABASE_URL=$(sed -n "s/.*var SUPABASE_URL = '\([^']*\)'.*/\1/p" index.html | head -1)
          SUPABASE_KEY=$(sed -n "s/.*var SUPABASE_KEY = '\([^']*\)'.*/\1/p" index.html | head -1)

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Nao consegui ler SUPABASE_URL/SUPABASE_KEY de index.html."
            exit 1
          fi
          echo "Projeto: ${SUPABASE_URL}"

          AGORA="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          TABELA="comissoes_state"
          ENDPOINT="${SUPABASE_URL}/rest/v1/${TABELA}"

          echo "Gravando heartbeat em ${AGORA}..."

          # Prefer: resolution=merge-duplicates = upsert.
          # return=representation faz o banco devolver a linha gravada.
          CORPO=$(printf '[{"id":"heartbeat","data":{"last_ping":"%s","origem":"github-actions"},"updated_at":"%s"}]' "$AGORA" "$AGORA")

          RESP=$(mktemp)
          CODIGO=$(curl -sS -o "$RESP" -w '%{http_code}' --max-time 30 \
            -X POST "$ENDPOINT" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=representation" \
            -d "$CORPO") || true

          echo "HTTP ${CODIGO}"
          echo "Resposta: $(cat "$RESP")"

          case "$CODIGO" in
            200|201) ;;
            000)
              echo "::error::Sem resposta do Supabase (DNS ou rede). O projeto pode estar pausado."
              exit 1 ;;
            401|403)
              echo "::error::Credenciais recusadas (HTTP ${CODIGO})."
              exit 1 ;;
            404)
              echo "::error::Tabela '${TABELA}' nao encontrada (HTTP 404)."
              exit 1 ;;
            *)
              echo "::error::Falha ao gravar (HTTP ${CODIGO})."
              exit 1 ;;
          esac

          # Confirma lendo de volta: um POST aceito nao garante linha gravada.
          LIDO=$(curl -sS --max-time 30 \
            "${ENDPOINT}?id=eq.heartbeat&select=data" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          echo "Lido de volta: ${LIDO}"

          if echo "$LIDO" | grep -q "$AGORA"; then
            echo "OK: heartbeat confirmado pelo banco em ${AGORA}."
          else
            echo "::error::Gravacao nao confirmada na leitura. Valor atual: ${LIDO}"
            exit 1
          fi
